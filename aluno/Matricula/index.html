<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrícula do Aluno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Matrícula do Aluno</h1>

<form id="matriculaForm">

  <h2>Dados do aluno</h2>

  <label>Nome completo</label>
  <input type="text" required>

  <label>Data de nascimento</label>
  <input type="date" required>

  <label>CPF</label>
  <input type="text" required>

  <h2>Endereço</h2>

  <label>Endereço completo</label>
  <input type="text" required>

  <label>Cidade</label>
  <input type="text" required>

  <label>Estado</label>
  <select required>
    <option value="">Selecione</option>
    <option>SP</option>
    <option>RJ</option>
    <option>MG</option>
    <option>ES</option>
    <option>PR</option>
    <option>SC</option>
    <option>RS</option>
    <option>Outro</option>
  </select>

  <h2>Curso</h2>

  
  

  <label>Turno</label>
  <select required>
    <option value="">Selecione</option>
    <option>Manhã</option>
    <option>Tarde</option>
    <option>Noite</option>
  </select>

  <label>Ano / Série</label>
  <input type="text" required>

  <h2>Responsável</h2>

  <label>Nome do responsável</label>
  <input type="text" required>

  <label>Telefone</label>
  <input type="tel" required>

  <label>E-mail</label>
  <input type="email">

  <button type="submit"> <a href="file:///D:/Quaiat.html/PW1/Horinzonte%20Belo/Professor/gestao.html">enviar matrícula       </a></button>

 

</form>

<script src="script.js"></script>
</body>
</html>
